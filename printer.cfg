sensor_pin: PF5 ## J46/T1/TH1/THERM2
gcode_id: F ## ?? why not

## left motor temp sensor
[temperature_sensor motor_l]
sensor_type: EPCOS 100K B57560G104F ## ender3 part from amazon
sensor_pin: PF7 ## J49/T3/TH3/THERM4
gcode_id: ML ## ?? why not

## right motor temp sensor
[temperature_sensor motor_r]
sensor_type: EPCOS 100K B57560G104F ## ender3 part from amazon
sensor_pin: PF6 ## J48/T2/TH2/THERM3
gcode_id: MR ## ?? why not

[heater_bed]
heater_pin: heater_bed_heating_pin
sensor_pin: heater_bed_sensor_pin
sensor_type: Generic 3950
min_temp: 0
max_temp: 120
# 60hz for US AC, to avoid flickering lights. halving that.
pwm_cycle_time: 0.0083

control: pid
pid_Kp: 64.914
pid_Ki: 2.186
pid_Kd: 481.989

; [heater_fan toolhead_cooling_fan]
; # pin: fan_toolhead_cooling_pin ## → toolboard
; fan_speed: 1

# based on the following stepper connections - from left to right:
# X Y E Z Z1 Z2
# In the wiring diagram, the Z-steppers are called
# Z1 / Left Z
# Z2 / Rear Z
# Z3 / Right Z
# here they're mapped to z, z1, z2 respectively.

[stepper_x]
step_pin: x_step_pin
dir_pin: x_dir_pin
enable_pin: !x_enable_pin
rotation_distance: 40
microsteps: 64

homing_speed: 50
homing_retract_dist: 5.0
homing_positive_dir: false

endstop_pin: ^!indxmcu:endstop

# verified with INDX 2026-11-21
position_endstop: -1.6
position_min: -1.6
position_max: 408.2

[tmc2209 stepper_x]
uart_pin: x_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[stepper_y]
step_pin: y_step_pin
dir_pin: y_dir_pin
enable_pin: !y_enable_pin
rotation_distance: 40
microsteps: 64

homing_speed: 50
homing_retract_dist: 5.0
homing_positive_dir: true

endstop_pin: ^!y_endstop_pin

# verified with INDX 2026-11-21
position_endstop: 412.7
position_min: -29.9
position_max: 412.7

[tmc2209 stepper_y]
uart_pin: y_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[stepper_z]
step_pin: z0_step_pin
dir_pin: !z0_dir_pin
enable_pin: !z0_enable_pin
rotation_distance: 4
microsteps: 16 # https://discord.com/channels/582187371529764864/859890291591217162/1286339423012786278

position_min: -5 # Needed for z-offset calibration and tilt_adjust.
; position_min: 0
position_max: 350

; homing_speed: 2 # matching load_cell_probe.speed during provisioning
homing_speed: 10

# indx
endstop_pin: probe:z_virtual_endstop

# cartographer needs this to be set to 0
; homing_retract_dist: 0


[tmc2209 stepper_z]
uart_pin: z0_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[stepper_z1]
step_pin: z1_step_pin
dir_pin: !z1_dir_pin
enable_pin: !z1_enable_pin
rotation_distance: 4
microsteps: 16 # https://discord.com/channels/582187371529764864/859890291591217162/1286339423012786278

[tmc2209 stepper_z1]
uart_pin: z1_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[stepper_z2]
step_pin: z2_step_pin
dir_pin: !z2_dir_pin
enable_pin: !z2_enable_pin
rotation_distance: 4
microsteps: 16 # https://discord.com/channels/582187371529764864/859890291591217162/1286339423012786278

[tmc2209 stepper_z2]
uart_pin: z2_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[controller_fan controller_fan]
pin: fan_controller_board_pin
heater: heater_bed
stepper: stepper_x,stepper_y,stepper_z,stepper_z1,stepper_z2

# https://discord.com/channels/1165274913624572014/1248822711157784596
[z_tilt]
speed: 200
horizontal_move_z: 15

; alternate_probe_direction: true

## # balls are at (from center)
## # (0,-204.5) - rear
## # (-204.5,204.5) - front left
## # (204.5,204.5) - front right
## # center: 203.5, 225
## z_positions:
##     -1,20.5
##     203.5,429.5
##     408,20.5
##
## # where to position the probe
## points:
##     3.5,26
##     197.75,417
##     393.50,26

# these are fixed, and relative to the origin. the origin should be 202.5 over
# and 202.5 down from the *center of the bed*. This accounts for a 410mm print
# sheet with 2.5mm margin on all sides.
; z_positions:
;     -2.0, -2.0
;     202.5, 407.0
;     407.0, -2.0
# The above are ideal, the below are measured positions after finding true
# origin. What the actual fuck?
z_positions:
    -2.0, -2.0
    202.30, 407.70
    407.60, 0.30

#> A list of X, Y coordinates that should be probed during a Z_TILT_ADJUST
#> command. Specify coordinates of the nozzle and be sure the probe is above the
#> bed at the given nozzle coordinates.
# each point is the z_position offset away from the edge by ~15mm, but also making sure the PROBE is away from the edge…
points:
    13, 13
    202.3, 379.95
    392.6, 15.30

# I *think* I calculated mm/step to be 0.00125, but that tolerance caused z_tilt
# to wig out (increasing range after each adjustment); doubling it made it
# work. coming from 0.02 this is still a lot tigher (and maybe unnecessarily
# so?). Others appear to be using 0.00750.
retry_tolerance: 0.00750
retries: 10

[bed_mesh]
# clanker sez 500 is at the sampling limit.
#> 500 mm/s is at this implementation’s theoretical sampling limit, so I
#> wouldn’t use it as the starting point.
#>
#> Your scanner runs at 250 Hz, and rapid scanning uses a 2 mm sampling window:
#>
#> ┌────────────┬────────────────────────────┐
#> │ Scan speed │ Nominal samples per window │
#> ├────────────┼────────────────────────────┤
#> │ 100 mm/s   │ 5                          │
#> ├────────────┼────────────────────────────┤
#> │ 200 mm/s   │ 2.5                        │
#> ├────────────┼────────────────────────────┤
#> │ 500 mm/s   │ 1                          │
#> └────────────┴────────────────────────────┘
#>
#> At 500, there’s essentially no averaging margin. Actual speed will be limited
#> by acceleration and row turnarounds.
speed: 200

# height of scanner during bed mesh scan
horizontal_move_z: 2.0
horizontal_z_clearance: 15

probe_count: 21, 21

algorithm: bicubic

mesh_min: 10,40
mesh_max: 390,390
zero_reference_position: 203.3,191.4

[firmware_retraction]
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40
retract_length: 0.5

