# It is recommended that you follow these steps to properly calibrate your printer:
# 0) Sanity check and PID Tuning: https://www.klipper3d.org/Config_checks.html
# 1) Pressure Advance: https://www.klipper3d.org/Pressure_Advance.html
# 2) Skew Correction: https://www.klipper3d.org/skew_correction.html
# 3) Resonance Compensation: https://www.klipper3d.org/Resonance_Compensation.html

## Pin names may be preceded by ! to indicate that a reverse polarity should be
## used (eg, trigger on low instead of high).
## ^ -- enable hardware pull-up resistor
## ~ -- enable hardware pull-down resistor

# (re)determining (0,0). assumes X homes negative and Y homes positive
#  1. set stepper_x.position_{min,endstop} to 0
#  2. set stepper_x.position_max to 420ish
#  3. set stepper_y.position_{max,endstop} to 450ish
#  4. set stepper_y.position_min to 0
#  5. home X and Y
#  6. position origin-finder tool on bed
#  7. jog to center of origin-finder tool
#  8. using *negative* of reported coordinates, update stepper_x.position_{min,endstop}
#  9. using reported coordinates, update stepper_y.position_{max,endstop} as CURRENT_MAX-reported
# 10. FIRMWARE_RESTART
# 11. home X and Y
# 12. jog to (0,0): confirm correct
# 13. jog X to max travel position: update stepper_x.position_max
# 14. jog Y to min travel position: update stepper_y.position_min
# 15. FIRMWARE_RESTART
# 16. home X and Y
# 17. jog to (202.5,202.5): confirm actual center of bed
# 18. jog X to max travel position: confirm no crash
# 19. jog Y to min travel position: confirm no crash
# 20. jog to z_tilt.z_positions: confirm correct


[include boards/btt-octopus-11/config-base.cfg]

[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 15000
max_z_velocity: 20
max_z_accel: 150
square_corner_velocity: 5

[mcu]
baud: 250000
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_btt-octopus-11-if00

[idle_timeout]
gcode:
  {% if printer.webhooks.state|lower == 'ready' %}
    {% if printer.pause_resume.is_paused|lower == 'false' %}
      M117 Idle timeout reached
      TURN_OFF_HEATERS
      M84
    {% endif %}
  {% endif %}

# 2 hour timeout
timeout: 7200

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[save_variables]
# relative to this file (printer.cfg)
filename: saved_variables.cfg

[force_move]
enable_force_move: True

[respond]

[skew_correction]

; [resonance_tester]
; accel_chip: adxl345
; probe_points:
;     200,200,20 # Override this in printer.cfg to be the center of your bed.

; [input_shaper]
; # limit accel to 4100 for y axis
; shaper_type_x: mzv
; shaper_freq_x: 66.8
; shaper_type_y: mzv
; shaper_freq_y: 37.4

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

## chamber temp sensor
[temperature_sensor chamber]
sensor_type: EPCOS 100K B57560G104F ## ender3 part from amazon
sensor_pin: PF5 ## J46/T1/TH1/THERM2
gcode_id: F ## ?? why not

## left motor temp sensor
[temperature_sensor motor_l]
sensor_type: EPCOS 100K B57560G104F ## ender3 part from amazon
sensor_pin: PF7 ## J49/T3/TH3/THERM4
gcode_id: ML ## ?? why not

## right motor temp sensor
[temperature_sensor motor_r]
sensor_type: EPCOS 100K B57560G104F ## ender3 part from amazon
sensor_pin: PF6 ## J48/T2/TH2/THERM3
gcode_id: MR ## ?? why not

[heater_bed]
heater_pin: heater_bed_heating_pin
sensor_pin: heater_bed_sensor_pin
sensor_type: Generic 3950
min_temp: 0
max_temp: 120
# 60hz for US AC, to avoid flickering lights. halving that.
pwm_cycle_time: 0.0083

control: pid
pid_Kp: 64.914
pid_Ki: 2.186
pid_Kd: 481.989

; [heater_fan toolhead_cooling_fan]
; # pin: fan_toolhead_cooling_pin ## → toolboard
; fan_speed: 1

# based on the following stepper connections - from left to right:
# X Y E Z Z1 Z2
# In the wiring diagram, the Z-steppers are called
# Z1 / Left Z
# Z2 / Rear Z
# Z3 / Right Z
# here they're mapped to z, z1, z2 respectively.

[stepper_x]
step_pin: x_step_pin
dir_pin: x_dir_pin
enable_pin: !x_enable_pin
rotation_distance: 40
microsteps: 64

homing_speed: 50
homing_retract_dist: 5.0
homing_positive_dir: false

endstop_pin: ^!indxmcu:endstop

# verified with INDX 2026-11-21
position_endstop: -1.6
position_min: -1.6
position_max: 408.2

[tmc2209 stepper_x]
uart_pin: x_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[stepper_y]
step_pin: y_step_pin
dir_pin: y_dir_pin
enable_pin: !y_enable_pin
rotation_distance: 40
microsteps: 64

homing_speed: 50
homing_retract_dist: 5.0
homing_positive_dir: true

endstop_pin: ^!y_endstop_pin

# verified with INDX 2026-11-21
position_endstop: 412.7
position_min: -29.9
position_max: 412.7

[tmc2209 stepper_y]
uart_pin: y_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[stepper_z]
step_pin: z0_step_pin
dir_pin: !z0_dir_pin
enable_pin: !z0_enable_pin
rotation_distance: 4
microsteps: 16 # https://discord.com/channels/582187371529764864/859890291591217162/1286339423012786278

position_min: -5 # Needed for z-offset calibration and tilt_adjust.
; position_min: 0
position_max: 350

; homing_speed: 2 # matching load_cell_probe.speed during provisioning
homing_speed: 10

# indx
endstop_pin: probe:z_virtual_endstop

# cartographer needs this to be set to 0
; homing_retract_dist: 0


[tmc2209 stepper_z]
uart_pin: z0_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[stepper_z1]
step_pin: z1_step_pin
dir_pin: !z1_dir_pin
enable_pin: !z1_enable_pin
rotation_distance: 4
microsteps: 16 # https://discord.com/channels/582187371529764864/859890291591217162/1286339423012786278

[tmc2209 stepper_z1]
uart_pin: z1_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[stepper_z2]
step_pin: z2_step_pin
dir_pin: !z2_dir_pin
enable_pin: !z2_enable_pin
rotation_distance: 4
microsteps: 16 # https://discord.com/channels/582187371529764864/859890291591217162/1286339423012786278

[tmc2209 stepper_z2]
uart_pin: z2_uart_pin
run_current: 1.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False

driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6

[controller_fan controller_fan]
pin: fan_controller_board_pin
heater: heater_bed
stepper: stepper_x,stepper_y,stepper_z,stepper_z1,stepper_z2

# https://discord.com/channels/1165274913624572014/1248822711157784596
[z_tilt]
speed: 200
horizontal_move_z: 15

; alternate_probe_direction: true

## # balls are at (from center)
## # (0,-204.5) - rear
## # (-204.5,204.5) - front left
## # (204.5,204.5) - front right
## # center: 203.5, 225
## z_positions:
##     -1,20.5
##     203.5,429.5
##     408,20.5
##
## # where to position the probe
## points:
##     3.5,26
##     197.75,417
##     393.50,26

# these are fixed, and relative to the origin. the origin should be 202.5 over
# and 202.5 down from the *center of the bed*. This accounts for a 410mm print
# sheet with 2.5mm margin on all sides.
; z_positions:
;     -2.0, -2.0
;     202.5, 407.0
;     407.0, -2.0
# The above are ideal, the below are measured positions after finding true
# origin. What the actual fuck?
z_positions:
    -2.0, -2.0
    202.30, 407.70
    407.60, 0.30

#> A list of X, Y coordinates that should be probed during a Z_TILT_ADJUST
#> command. Specify coordinates of the nozzle and be sure the probe is above the
#> bed at the given nozzle coordinates.
# each point is the z_position offset away from the edge by ~15mm, but also making sure the PROBE is away from the edge…
points:
    13, 13
    202.3, 379.95
    392.6, 15.30

# I *think* I calculated mm/step to be 0.00125, but that tolerance caused z_tilt
# to wig out (increasing range after each adjustment); doubling it made it
# work. coming from 0.02 this is still a lot tigher (and maybe unnecessarily
# so?). Others appear to be using 0.00750.
retry_tolerance: 0.00750
retries: 10

# @todo reconcile with <https://discord.com/channels/1339873144097472512/1352591870097756161/1573601599576875071>
# @todo what's below is mostly stolen from that, but ABSOLUTELY not configured for this machine!
[bed_mesh]
speed: 200

# height of scanner during bed mesh scan
horizontal_move_z: 3.5
horizontal_z_clearance: 15

probe_count: 12, 12

algorithm: bicubic

; use_probe_xy_offsets: True
mesh_min: 25,40
mesh_max: 325,300
zero_reference_position: 175, 175

[firmware_retraction]
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40
retract_length: 0.5

