[include indx/macros/indx.cfg]
[include indx/macros/indx-tc-macros.cfg]
[include indx/macros/indx-cal.cfg]
[include indx/macros/homing.cfg]

## try to override stuff from the above 4 without having to import the files into my config.
[gcode_macro TOOL_POSITIONS]
variable_tool_count: 4
variable_docks_calibrated: True

variable_t0_x: 1.728
variable_t0_dock_y: -29.500

variable_t1_x: 47.587
variable_t1_dock_y: -29.500

variable_t2_x: 354.784
variable_t2_dock_y: -29.500

variable_t3_x: 402.394
variable_t3_dock_y: -29.500

[mcu indxmcu]
serial: /dev/serial/by-id/usb-Bondtech_INDX_01543BA8374731532020204B0E2C04FF-if00

[indx]
mcu: indxmcu

# These are control parameters for the induction heater — leave them at these
# values
pid_kp: 1.0
pid_ti: 0.0
pid_td: 0.0
pid_b: 1.0

[extruder]
# Custom sensor type provided by the INDX plugin — reads temperature via the IR
# sensor on the induction board
sensor_type: indx
min_temp: 0
max_temp: 300
# Reduce display and wait-condition lag during rapid induction heat-up
smooth_time: 0.3

heater_pin: indx:heater
# Induction heating uses watermark (on/off bang-bang) control, not PID. This
# works well for induction because of its very fast response time. Do not
# change to pid.
control: watermark

# Change to match your passive tool nozzle size (0.4 / 0.6 / 0.8 / 1.0)
nozzle_diameter: 0.4

filament_diameter: 1.75

step_pin: indxmcu:motor_step
# @todo If filament feeds backwards, change to: !indxmcu:motor_dir
dir_pin: indxmcu:motor_dir
enable_pin: !indxmcu:motor_enable
microsteps: 32

# Pre-calibrated for the DX extruder — do not change
rotation_distance: 5.7

[tmc2240 extruder]
cs_pin: indxmcu:motor_cs
spi_software_sclk_pin: indxmcu:motor_sclk
spi_software_mosi_pin: indxmcu:motor_mosi
spi_software_miso_pin: indxmcu:motor_miso
# Reference resistor value for the TMC2240 on the INDX PCB — do not change
rref: 24000
run_current: 0.6

## irrelevant; using cpap
[fan]
pin: indxmcu:part_cooling
tachometer_pin: indxmcu:part_cooling_tacho

[neopixel indx]
pin: indxmcu:led
# Fixed for the Smart Head LED array — do not change
chain_count: 16

[lis2dw]
# Built-in accelerometer on the INDX PCB — used for input shaper calibration
i2c_mcu: indxmcu
i2c_bus: sercom3

[angle indx]
# Magnetic encoder that reads extruder rotation — used for precise extrusion monitoring
sensor_type: as5047d
stepper: extruder
cs_pin: indxmcu:encoder_cs
spi_bus: sercom1

[load_cell_probe]
# counts_per_gram and reference_tare_counts come from load cell calibration
sensor_type: ads131m02
cs_pin: indxmcu:loadcell_cs
spi_bus: sercom1
data_ready_pin: indxmcu:loadcell_drdy
channels: 0
sample_rate: 500
z_offset: -0.15 # @todo manually calibrate
force_safety_limit: 3200
trigger_force: 150
speed: 2
retry_speed: 1.0
lift_speed: 15
pullback_distance: 0.35
pullback_speed: 0.3
samples: 3
samples_result: median
sample_retract_dist: 0.35
samples_tolerance: 0.05
samples_tolerance_retries: 3

# @todo reconcile with <https://discord.com/channels/1339873144097472512/1352591870097756161/1573601599576875071>
[probe_eddy_current scanner]
sensor_type: ldc1612
i2c_mcu: indxmcu
i2c_bus: sercom3
intb_pin: indxmcu:ldc_int
# The toolboard clocks the LDC1612 from its 25 MHz crystal
frequency: 25000000
# Scanner position relative to the nozzle (Smart Head CAD)
# [blalor] I copied the design from the cad, but have not verifed this…
x_offset: 0
y_offset: 34.472
z_offset: 1.0
# The load cell stays the default probe; the scanner is selected with PROBE=scanner
register_as_probe: False
# The INDX coil trips the LDC1612 amplitude-low error in normal use
amplitude_errors: high

# Scanner coil temperature, for monitoring
[temperature_sensor scanner_coil]
sensor_type: indx
indx_sensor: ldc_coil

