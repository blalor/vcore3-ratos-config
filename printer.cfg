# It is recommended that you follow these steps to properly calibrate your printer:
# 0) Sanity check and PID Tuning: https://www.klipper3d.org/Config_checks.html
# 1) Pressure Advance: https://www.klipper3d.org/Pressure_Advance.html
# 2) Skew Correction: https://www.klipper3d.org/skew_correction.html
# 3) Resonance Compensation: https://www.klipper3d.org/Resonance_Compensation.html

## Pin names may be preceded by ! to indicate that a reverse polarity should be
## used (eg, trigger on low instead of high).
## ^ -- enable hardware pull-up resistor
## ~ -- enable hardware pull-down resistor

# (re)determining (0,0). assumes X homes negative and Y homes positive
#  1. set stepper_x.position_{min,endstop} to 0
#  2. set stepper_x.position_max to 420ish
#  3. set stepper_y.position_{max,endstop} to 450ish
#  4. set stepper_y.position_min to 0
#  5. home X and Y
#  6. position origin-finder tool on bed
#  7. jog to center of origin-finder tool
#  8. using *negative* of reported coordinates, update stepper_x.position_{min,endstop}
#  9. using reported coordinates, update stepper_y.position_{max,endstop} as CURRENT_MAX-reported
# 10. FIRMWARE_RESTART
# 11. home X and Y
# 12. jog to (0,0): confirm correct
# 13. jog X to max travel position: update stepper_x.position_max
# 14. jog Y to min travel position: update stepper_y.position_min
# 15. FIRMWARE_RESTART
# 16. home X and Y
# 17. jog to (202.5,202.5): confirm actual center of bed
# 18. jog X to max travel position: confirm no crash
# 19. jog Y to min travel position: confirm no crash
# 20. jog to z_tilt.z_positions: confirm correct

# Just … no.
# https://docs.kalico.gg/Telemetry.html
[telemetry]
enabled: False # disable telemetry

[include boards/btt-octopus-11/config-base.cfg]

[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 15000
max_z_velocity: 20
max_z_accel: 150
square_corner_velocity: 5

[mcu]
baud: 250000
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_btt-octopus-11-if00

[idle_timeout]
gcode:
  {% if printer.webhooks.state|lower == 'ready' %}
    {% if printer.pause_resume.is_paused|lower == 'false' %}
      M117 Idle timeout reached
      TURN_OFF_HEATERS
      M84
    {% endif %}
  {% endif %}

# 2 hour timeout
timeout: 7200

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[save_variables]
# relative to this file (printer.cfg)
filename: saved_variables.cfg

[force_move]
enable_force_move: True

[respond]

[skew_correction]

